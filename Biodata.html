<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Biodata</title>
    <link rel="stylesheet" href="stylebiodata.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="container">
            <h1>Website saya</h1>
        </div>
    </header>

    <!-- Main Content / Form Section -->
    <main class="main-content">
        <div class="container">
            <!-- Label Form Biodata menggunakan ID dan Class -->
            <h2 id="judul-biodata" class="label-biodata">Form Biodata</h2>

            <form action="#" method="POST" class="form-biodata">
                <div class="form-group">
                    <label for="nama">Nama:</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan Nama Lengkap" required>
                </div>

                <div class="form-group">
                    <label for="nim">NIM:</label>
                    <input type="text" id="nim" name="nim" placeholder="Masukkan NIM" required>
                </div>

                <div class="form-group">
                    <label>Jenis Kelamin:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="jenis_kelamin" value="Laki-laki" required> Laki-laki</label>
                        <label><input type="radio" name="jenis_kelamin" value="Perempuan"> Perempuan</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat:</label>
                    <textarea id="alamat" name="alamat" rows="4" placeholder="Masukkan Alamat Lengkap" required></textarea>
                </div>

                <div class="form-group">
                    <label for="jurusan">Jurusan:</label>
                    <select id="jurusan" name="jurusan" required>
                        <option value="">-- Pilih Jurusan --</option>
                        <option value="Teknik Informatika">Teknik Informatika</option>
                        <option value="Sistem Informasi">Sistem Informasi</option>
                        <option value="Manajemen">Manajemen</option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn-submit">Kirim</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>Footer</p>
    </footer>

</body>
</html>
