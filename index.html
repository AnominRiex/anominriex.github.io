<!DOCTYPE html> <!-- Deklarasi tipe dokumen HTML5 -->
<html> <!-- Tag pembuka untuk seluruh struktur kode HTML -->
<head> <!-- Tag pembuka bagian head (berisi metadata dan informasi dokumen) -->
    <title>Belajar Web</title> <!-- Menentukan judul halaman yang tampil di tab browser -->
    <!-- memanggil file CSS yang telah dibuat --> <!-- Komentar HTML sebagai penanda -->
    <link rel="stylesheet" type="text/css" href="style2.css"> <!-- Menghubungkan file HTML dengan file CSS eksternal (style.css) -->
</head> <!-- Tag penutup bagian head -->
<body> <!-- Tag pembuka bagian body (berisi seluruh konten utama yang terlihat di web) -->

    <!-- bagian header template --> <!-- Komentar penanda awal bagian header -->
    <header> <!-- Tag pembuka elemen struktur header halaman -->
        <h2>Website saya</h2> <!-- Judul tingkat 2 berisi teks "Website saya" -->
    </header> <!-- Tag penutup elemen header -->
    <!-- akhir bagian header template --> <!-- Komentar penanda akhir bagian header -->

    <div class="prodi">Halaman Profiekl<!-- Tag penutup paragraf --></div>

    <!-- bagian footer template --> <!-- Komentar penanda awal bagian footer -->
    <footer> <!-- Tag pembuka elemen struktur footer (kaki halaman) -->
        <h1>Footer</h1> <!-- Judul tingkat 1 berisi teks "Footer" -->
    </footer> <!-- Tag penutup elemen footer -->
    <!-- akhir bagian Footer template --> <!-- Komentar penanda akhir bagian footer -->

</body> <!-- Tag penutup bagian body -->
</html> <!-- Tag penutup seluruh struktur dokumen HTML -->
